# Terraform Provider release workflow.
name: Release

# Releases are driven by release-please.yml, which creates the tag and the
# GitHub Release and then calls this workflow to build the binaries and attach
# them.
#
# There is deliberately no `push: tags` trigger. Two reasons, either of which
# is sufficient:
#
#   - release-please cuts its tag with the default GITHUB_TOKEN, and tags
#     created by GITHUB_TOKEN do not trigger workflows. A tag trigger here
#     would silently never fire.
#   - If the token is ever swapped for a GitHub App token (see the comment in
#     release-please.yml), tags *would* fire it — in addition to the explicit
#     call below, running GoReleaser twice for the same tag.
#
# workflow_dispatch is the manual escape hatch: re-running a release whose tag
# already exists, or building a tag pushed by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.5.0. The tag must already exist."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.5.0. The tag must already exist."
        required: true
        type: string

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag }}
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
